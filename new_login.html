<!DOCTYPE html>

<html class="dark" lang="en"><head>

        }

<body class="bg-background-dark font-display antialiased selection:bg-primary selection:text-background-dark overflow-x-hidden">
<div class="relative flex h-screen w-full flex-col bg-background-dark overflow-hidden border-4 border-zinc-900">
<!-- CRT Scanline & Noise Effect Overlays -->
<div class="absolute inset-0 crt-overlay z-50 pointer-events-none"></div>
<div class="absolute inset-0 noise z-40 pointer-events-none"></div>
<!-- Header -->
<div class="flex items-center bg-zinc-950 p-6 border-b-2 border-primary/20 justify-between">
<div class="text-primary flex size-10 shrink-0 items-center justify-center border-2 border-primary">
<span class="material-symbols-outlined !text-[24px]">terminal</span>
</div>
<h2 class="text-primary text-xs font-bold leading-tight tracking-[0.2em] flex-1 text-right">LC_AUTH_v4.02</h2>
</div>
<div class="flex-1 flex flex-col justify-center px-6">
<!-- Branding -->
<div class="mb-12">
<div class="inline-block bg-primary text-background-dark px-2 py-1 text-[10px] font-black tracking-widest mb-2">SECURITY_LEVEL_HIGH</div>
<h1 class="text-zinc-100 tracking-tighter text-6xl font-black leading-[0.85] uppercase break-words">
                    System<br/>
<span class="text-primary">Access</span>
</h1>
<div class="h-1 w-24 bg-primary mt-4"></div>
</div>
<!-- Login Form -->
<div class="space-y-6">
<div class="flex flex-wrap items-end gap-2">
<label class="flex flex-col flex-1">
<p class="text-primary text-[10px] font-bold leading-normal pb-2 tracking-[0.3em]">USER_ID</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-none text-primary focus:outline-0 focus:ring-0 border-2 border-zinc-800 bg-zinc-900/50 focus:border-primary h-16 placeholder:text-zinc-700 p-4 text-lg font-bold leading-normal uppercase tracking-widest" placeholder="REQUIRED_FIELD" type="text" value=""/>
</label>
</div>
<div class="flex flex-wrap items-end gap-2">
<label class="flex flex-col flex-1">
<p class="text-primary text-[10px] font-bold leading-normal pb-2 tracking-[0.3em]">ACCESS_KEY</p>
<div class="flex w-full flex-1 items-stretch">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-none text-primary focus:outline-0 focus:ring-0 border-2 border-zinc-800 border-r-0 bg-zinc-900/50 focus:border-primary h-16 placeholder:text-zinc-700 p-4 text-lg font-bold leading-normal tracking-widest" placeholder="********" type="password" value=""/>
<div class="text-zinc-600 flex border-2 border-zinc-800 bg-zinc-900/50 items-center justify-center px-4">
<span class="material-symbols-outlined">visibility</span>
</div>
</div>
</label>
</div>
<div class="pt-6">
<button class="group relative flex w-full cursor-pointer items-center justify-center overflow-hidden h-20 bg-primary text-background-dark text-xl font-black tracking-[0.2em] transition-all active:scale-[0.98]">
<span class="relative z-10">INITIATE_LOGIN</span>
<div class="absolute inset-0 bg-white opacity-0 group-hover:opacity-10 transition-opacity"></div>
</button>
</div>
</div>
<!-- Industrial Decorative Elements -->
<div class="mt-12 flex justify-between items-center opacity-30">
<div class="flex flex-col gap-1">
<div class="h-[2px] w-8 bg-primary"></div>
<div class="h-[2px] w-12 bg-primary"></div>
<div class="h-[2px] w-6 bg-primary"></div>
</div>
<div class="text-[8px] text-primary font-bold tracking-tighter text-right leading-none uppercase">
                    Encryption: AES-256-GCM<br/>
                    Protocol: SSH-v2.1<br/>
                    Status: Standby
                </div>
</div>
</div>
<!-- Bottom Status Bar -->
<div class="p-4 border-t-2 border-zinc-900 flex justify-between items-center text-[10px] text-zinc-500 font-bold uppercase tracking-widest">
<div class="flex items-center gap-2">
<div class="size-2 bg-primary animate-pulse"></div>
                CONNECT_ESTABLISHED
            </div>
<div>
                LOCAL_NODE: 127.0.0.1
            </div>
</div>
</div>
